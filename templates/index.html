{% extends "base.html" %}

{% block content %}

<div class="card">

    <span class="badge">
        AI Powered Risk Prediction
    </span>

    <h2>Project Registration</h2>

    <p>
        Provide the project details below. The system will analyze your project and generate
        AI-powered risk assessment, market intelligence, and actionable recommendations.
    </p>

    <form action="/submit" method="POST">

        <!-- Row 1 -->
        <div class="form-row">

            <div class="form-group">
                <label>Project Name</label>
                <input
                    type="text"
                    name="project_name"
                    placeholder="Enter Project Name"
                    required>
            </div>

            <div class="form-group">
                <label>Client / Organization</label>
                <input
                    type="text"
                    name="organization"
                    placeholder="Enter Client or Organization"
                    required>
            </div>

        </div>

        <!-- Row 2 -->
        <div class="form-row">

            <div class="form-group">
                <label>Domain</label>
                <select name="domain" required>
                    <option value="Healthcare">Healthcare</option>
                    <option value="Finance">Finance</option>
                    <option value="Education">Education</option>
                    <option value="E-Commerce">E-Commerce</option>
                    <option value="Logistics">Logistics</option>
                    <option value="Agriculture">Agriculture</option>
                    <option value="AI">AI</option>
                    <option value="Cybersecurity">Cybersecurity</option>
                    <option value="Manufacturing">Manufacturing</option>
                    <option value="Retail">Retail</option>
                </select>
            </div>

            <div class="form-group">
                <label>Technology Stack</label>
                <input
                    type="text"
                    name="tech_stack"
                    placeholder="Python, Flask, PostgreSQL"
                    required>
            </div>

        </div>

        <!-- Row 3 -->
        <div class="form-row">

            <div class="form-group">
                <label>Team Size</label>
                <input
                    type="number"
                    name="team_size"
                    placeholder="Enter Team Size"
                    required>
            </div>

            <div class="form-group">
                <label>Estimated Budget (₹)</label>
                <input
                    type="number"
                    name="budget"
                    placeholder="Enter Budget"
                    required>
            </div>

        </div>

        <!-- Row 4 -->
        <div class="form-row">

            <div class="form-group">
                <label>Timeline (Months)</label>
                <input
                    type="number"
                    name="timeline"
                    placeholder="6"
                    required>
            </div>

            <div class="form-group">
                <label>Project Priority</label>

                <select name="priority">

                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                    <option value="Critical">Critical</option>

                </select>

            </div>

        </div>

        <!-- Description -->
        <div class="form-group">

            <label>Project Description</label>

            <textarea
                name="description"
                rows="3"
                placeholder="Describe your project objectives, scope and expected outcomes..."
                required></textarea>

        </div>

        <button type="submit">
            Analyze Project
        </button>

    </form>

</div>

{% endblock %}
